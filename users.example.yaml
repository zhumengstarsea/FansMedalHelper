# 每天维护粉丝牌：亮着的也发弹幕，开播中的房间停播后再发送。
# 复制为 users.yaml 后填写自己的账号和通知凭据；不要提交真实 users.yaml。
USERS:
  - access_key: "YOUR_BILIBILI_ACCESS_KEY"
    white_uid: 0 # 0 表示不限制；指定 UID 后仅执行白名单，黑名单不生效
    banned_uid: 0 # 填入自己要排除的 UID，多个用英文逗号分隔；示例不包含私人名单

CRON: "0 0 * * *" # 每天 0 点一次；服务器时区设置为 Asia/Shanghai
STOPWATCHINGTIME: "00:00:00" # 最晚在次日 0 点前一分钟停止等待，未补齐的房间写入通知

DANMAKU_ONLY: 1 # 仅执行弹幕维护和点亮检查，跳过观看、点赞及所有签到
DANMAKU_COUNT: 10 # 每牌每天发送 10 条，已点亮的牌子也发送
DANMAKU_CD: 10 # 两条弹幕之间间隔 10 秒
DANMAKU_ROUND_ROBIN: 1 # 常规模式的轮询开关；仅弹幕模式固定按房间轮询
WEARMEDAL: 1 # 发弹幕时佩戴对应粉丝牌，任务结束后恢复开始前佩戴的牌子

# 下列任务全部关闭；仅弹幕模式也会跳过这些任务。
WATCHINGLIVE: 0
LIKE_COUNT: 0
LIKE_CD: -1
DOSIGN: 0
SIGNINGROUP_CD: -1
CUSTOMSIGNIN_CD: -1

# 保留常规模式的兼容配置；仅弹幕模式不受亲密度阈值及任务序号限制。
MIN_INTIMACY_THRESHOLD: 30
WATCHINGLIVE_CD: 60
CRON_INDEX: 0

SENDKEY: "" # 不启用 Server 酱
PROXY: "" # 不使用 HTTP/SOCKS 推送代理
MOREPUSH:
  notifier: telegram
  params:
    token: "YOUR_TELEGRAM_BOT_TOKEN"
    userid: "YOUR_TELEGRAM_CHAT_ID"
    api_url: "api.telegram.org" # 使用反代时改成自己的域名及路径，不带 https://
